name: CI Pipeline

on:
  push:
    branches: ["**"] # Runs on push to ANY branch (feature branches, main, etc.)
  pull_request:
    branches: [main, master] # Runs when PRs are targeting main/master

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run TypeScript Check
        run: npx tsc --noEmit

      - name: Run Vitest Suite
        run: npx vitest run